name: Verify illustrated components
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - name: Build for repository hosting
        run: bun run build
        env:
          PUBLIC_BASE_PATH: /heavensgate
      - uses: actions/upload-artifact@v4
        with:
          name: heavens-gate-gallery-rulebook-and-print-kit
          path: build/
          retention-days: 14
